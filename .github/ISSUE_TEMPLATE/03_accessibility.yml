name: ♿ Accessibility barrier
description: Something in the report, the command line, or the docs you cannot read or use
title: "♿ <TITLE>"
labels: ["accessibility"]
body:
  - type: textarea
    id: barrier
    attributes:
      label: What stopped you?
      description: What you tried to do, where, and what got in the way.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >
        The vibator version, the command you ran, the terminal and OS, and any assistive technology (screen reader, magnifier, high contrast, voice control) with its version.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What would work for you?
      description: Optional. How you expected it to work, or what would help.
  - type: checkboxes
    id: coc
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/vibator/vibator/blob/main/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow Vibator's Code of Conduct
          required: true
