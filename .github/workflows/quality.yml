name: Quality

on:
  merge_group:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        env:
          CI: true
          HUSKY: "0"
        run: |
          npm ci

      - name: Run Biome (format + lint)
        run: |
          npm run lint

      - name: Check architecture boundaries
        run: |
          npm run arch

      - name: Check for dead code and unused dependencies
        run: |
          npm run knip

      - name: Build (tsc + generated schema)
        run: |
          npm run build

      - name: Check the generated schema is committed in sync
        run: |
          git diff --exit-code schema.json

      - name: Run unit tests
        run: |
          npm run test

      - name: Vibator on its own source
        run: |
          node dist/cli.js

      - name: Report Coverage
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2

  bun:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        env:
          CI: true
          HUSKY: "0"
        run: |
          bun install

      - name: Build (tsc + generated schema)
        run: |
          bun --bun run build

      - name: Run unit tests on Bun (coverage stays on the Node job)
        run: |
          bun --bun vitest run

      - name: Vibator on its own source
        run: |
          bun --bun dist/cli.js

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        env:
          CI: true
          HUSKY: "0"
        run: |
          npm ci

      - name: Lint commit messages (Conventional Commits drive releases)
        run: |
          npx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" --verbose
